plugins {
    id 'java'
    id 'application'
}

group = 'com.paytm.hybris'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.paytm.hybris.impex.ui.ImpexConverterUI'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.paytm.hybris.impex.ui.ImpexConverterUI',
            'Implementation-Title': 'Hybris ImpEx Converter',
            'Implementation-Version': project.version
        )
    }
}
